name = "snapog"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "snapog-db"
database_id = "placeholder-set-after-wrangler-d1-create"

[[r2_buckets]]
binding = "OG_CACHE"
bucket_name = "snapog-og-cache"

[vars]
ENVIRONMENT = "development"
# Set AUTH_SECRET via `wrangler secret put AUTH_SECRET` for dashboard cookie signing

# NOTE: Do NOT deploy with `--env production` unless you also duplicate
# [[d1_databases]] / [[r2_buckets]] under that env — top-level bindings
# are what `wrangler deploy` (default) and CI use. Staging is optional.
[env.staging]
name = "snapog-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
